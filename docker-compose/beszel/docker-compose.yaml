services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://pi.local:8090
    ports:
      - "8090:8090"
    volumes:
      - ./hub_data:/beszel_data
      - ./socket:/beszel_socket
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    # Talks to the hub over a shared unix socket rather than the network,
    # and needs the host network namespace to report accurate Pi stats
    # (interfaces, etc).
    network_mode: host
    volumes:
      - ./agent_data:/var/lib/beszel-agent
      - ./socket:/beszel_socket
      # Read-only: lets the agent report per-container CPU/mem alongside
      # host stats, without granting control over containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      # Agent runs on host network (not the hub's bridge network), so it
      # must reach the hub via localhost, not the container DNS name.
      HUB_URL: http://localhost:8090
      # Universal token (Settings > Add System > universal token) plus the
      # hub's SSH public key (GET /api/beszel/getkey), used to auto-register
      # this system with the hub on first connection. Set in .env (gitignored).
      TOKEN: ${BESZEL_AGENT_TOKEN}
      KEY: ${BESZEL_HUB_KEY}
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
