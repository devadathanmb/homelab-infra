pages:
  - name: Home
    # Slim, centered startpage layout.
    width: slim
    hide-desktop-navigation: true
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: search
            autofocus: true

          - type: group
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: Asia/Kolkata
                    label: Local

              - type: weather
                # Open-Meteo's geocoder indexes this town as "Chalakudi"
                # (the -dy spelling returns no results).
                location: Chalakudi, Kerala, India
                units: metric
                hour-format: 24h

          - type: monitor
            cache: 1m
            title: Services
            # Probed from inside the container, so use host.docker.internal
            # (mapped via extra_hosts) rather than the mDNS pi.local name.
            sites:
              - title: Jellyfin
                url: http://host.docker.internal:8096
                icon: di:jellyfin
              - title: AdGuard Home
                # Admin UI is mapped host 8000 -> container 3000.
                url: http://host.docker.internal:8000
                icon: di:adguard-home
              - title: qBittorrent
                url: http://host.docker.internal:8080
                icon: di:qbittorrent

          - type: server-stats
            servers:
              - type: local
                name: Pi
                # hwmon sensor name on this Pi (checked via /sys/class/hwmon).
                cpu-temp-sensor: cpu_thermal
                mountpoints:
                  "/":
                    name: Root

          - type: docker-containers
            hide-by-default: true
            running-only: true

          - type: group
            widgets:
              - type: to-do
                id: home-todo

              - type: calendar
                first-day-of-week: monday

          - type: hacker-news
            limit: 15
            collapse-after: 5

          - type: bookmarks
            groups:
              - title: Services
                links:
                  - title: Jellyfin
                    url: http://pi.local:8096
                  - title: AdGuard Home
                    url: http://pi.local:8000
                  - title: qBittorrent
                    url: http://pi.local:8080
                  - title: Portainer
                    url: https://pi.local:9443
                  - title: Beszel
                    url: http://pi.local:8090
