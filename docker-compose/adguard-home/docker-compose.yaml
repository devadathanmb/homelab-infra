name: adguardhome

services:
  adguardhome:
    image: adguard/adguardhome
    restart: always
    user: "1000:1000" # run as unprivileged user so git-tracked config stays writable
    cap_add:
      - NET_BIND_SERVICE # bind port 53 as non-root
    ports:
      - 53:53/tcp # plain dns over tcp
      - 53:53/udp # plain dns over udp
      - 80:80/tcp # http web interface
      - 8000:3000/tcp # initial setup web interface
    volumes:
      - ./conf:/opt/adguardhome/conf # app configuration (git-tracked)
      - work:/opt/adguardhome/work # app working directory
    labels:
      autoheal: "true"
    # AdGuard Home dropped its own Docker HEALTHCHECK upstream (caused issues
    # with bind_hosts/Podman), so we probe the web UI on port 80 ourselves.
    # Image only ships wget, not curl.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  work:
    driver: local
